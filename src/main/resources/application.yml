spring:
  application:
    name: family-food
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    enabled: true
  quartz:
    job-store-type: jdbc
    scheduler-name: familyFoodScheduler
    auto-startup: true
    overwrite-existing-jobs: false
    startup-delay: 10s
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.threadPool.threadCount: 2
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
      org.quartz.jobStore.tablePrefix: QRTZ_
      org.quartz.jobStore.isClustered: false
server:
  port: 8080

logging:
  file:
    path: logs

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

family-food:
  jwt:
    secret: dev-only-family-food-secret-dev-only-family-food-secret
    ttl-minutes: 1440
  upload-dir: ./uploads
  init-admin-password: admin123
  cors-allowed-origins: http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174
  ai-provider: deepseek
  ai:
    base-url: https://api.deepseek.com
    api-key: ""
    chat-model: deepseek-v4-pro
    timeout-seconds: 30
